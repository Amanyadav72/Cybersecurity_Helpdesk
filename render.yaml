services:
  - type: web
    name: cyber-safety-helpdesk
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_URL
        value: https://cybersecurity-helpdesk.onrender.com
      - key: FRONTEND_URL
        value: https://cybersecurity-helpdesk.onrender.com
      - key: NEON_DATABASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        value: 934619565539-rum4ab9b3nb7hvhinb5tqvuo9rhaoq7b.apps.googleusercontent.com
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: SECRET_KEY
        generateValue: true
